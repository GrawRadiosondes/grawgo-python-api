[build-system]
requires = ["setuptools>=74.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "grawgo"
version = "2.2.0"
description = "A python lib to use the grawGo api"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Niklas Wildenburg", email = "niklas.wildenburg@graw.de" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
dependencies = [
    "requests~=2.34.2"
]

[dependency-groups]
"dev" = [
    "pytest~=9.1.1",
    "Faker~=40.28.1",
    "python-dotenv~=1.2.2",
    "mypy~=2.2.0"
]

[project.urls]
"Homepage" = "https://github.com/GrawRadiosondes/grawgo-python-api"
"Bug Tracker" = "https://github.com/GrawRadiosondes/grawgo-python-api/issues"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::urllib3.exceptions.InsecureRequestWarning"
]

[tool.bumpversion]
current_version = "2.2.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []
allow_shell_hooks = false
